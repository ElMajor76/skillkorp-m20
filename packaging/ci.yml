name: CI — Lint & Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint (flake8) + Tests (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances de test
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8

      - name: Lint — flake8 (erreurs critiques uniquement)
        run: |
          # E9xx = erreurs de syntaxe/runtime, F63x/F7xx/F82x = bugs logiques
          flake8 m20_driver.py profile_manager.py m20_gui.py m20_tray.py m20ctl \
            --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Style — flake8 (avertissements, non bloquant)
        run: |
          flake8 m20_driver.py profile_manager.py m20_gui.py m20_tray.py m20ctl \
            --count --exit-zero --max-line-length=120 --statistics
        continue-on-error: true

      - name: Tests unitaires — pytest
        run: |
          python -m pytest tests/ -v --tb=short

  smoke-test:
    name: Smoke test — import du driver
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Vérifier que m20_driver s'importe sans erreur
        run: |
          python -c "
          import m20_driver
          from m20_driver import (
              POLLING_RATE_MAP, LIGHT_MODES, BUTTON_ACTIONS,
              PHYSICAL_BTN_TO_SLOT, _HIDIOCSFEATURE
          )
          print(f'✓ m20_driver importé : {len(BUTTON_ACTIONS)} actions boutons')
          print(f'✓ PHYSICAL_BTN_TO_SLOT : boutons {sorted(PHYSICAL_BTN_TO_SLOT.keys())}')
          assert set(PHYSICAL_BTN_TO_SLOT.keys()) == {1,2,3,4,5,6}, 'Bouton 6 manquant!'
          print('✓ Tous les boutons 1-6 présents')
          "

      - name: Vérifier que profile_manager s'importe sans erreur
        run: |
          python -c "
          from profile_manager import (
              DEFAULT_PROFILES, is_autostart_enabled, set_autostart,
              ProfileManager
          )
          print(f'✓ profile_manager importé : {len(DEFAULT_PROFILES)} profils')
          required = {'light_mode', 'brightness', 'speed', 'light_color'}
          for pid, p in DEFAULT_PROFILES.items():
              missing = required - set(p.keys())
              assert not missing, f'Profil {pid} manque: {missing}'
          print('✓ Tous les profils ont les champs RGB')
          "
